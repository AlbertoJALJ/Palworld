<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palworld Data API</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6df6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3EP%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5c6673;
    --line: #dfe3e9; --accent: #2f6df6; --accent-ink: #ffffff;
    --warn-bg: #fff6e0; --warn-line: #e8c96a; --warn-ink: #6a4e07;
    --special: #7b3fbf; --radius: 10px;
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1c2027; --ink: #e8ecf2; --muted: #98a2b1;
      --line: #2c323c; --accent: #5b8dff; --accent-ink: #0d1117;
      --warn-bg: #3a2f14; --warn-line: #7a6427; --warn-ink: #f0d79a;
      --special: #b98cf0; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
  .lang-switch { display: flex; gap: 4px; flex: 0 0 auto; }
  .lang-btn {
    padding: 5px 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 999px; cursor: pointer; font: inherit;
    font-size: 0.8rem; font-weight: 600;
  }
  .lang-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner {
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink);
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 20px; font-size: 0.9rem;
  }
  .banner[hidden] { display: none !important; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tab {
    padding: 7px 14px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 999px; cursor: pointer; font-size: 0.88rem;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 180px; min-width: 0; }
  label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  input, select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; width: 100%;
  }
  button {
    padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .out { margin-top: 6px; }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .err { color: #c0392b; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) { .err { color: #ff9b8f; } }
  .step {
    display: flex; gap: 12px; align-items: baseline; padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .step:last-child { border-bottom: 0; }
  .gen {
    flex: 0 0 auto; font-variant-numeric: tabular-nums; font-size: 0.75rem;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px;
  }
  .formula-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.9rem; }
  .connector { color: var(--muted); }
  .tag {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .tag.special { color: var(--special); border-color: var(--special); }
  .tag.gender { color: var(--accent); border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }

  .pal-icon {
    width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
    object-fit: cover; background: var(--bg); border: 1px solid var(--line);
  }
  .pal-icon.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  }
  .pal-icon.small { width: 20px; height: 20px; border-radius: 5px; font-size: 0.6rem; }

  .picker { position: relative; }
  .picker-button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; cursor: pointer;
    text-align: left;
  }
  .picker-button:focus-visible, .picker-button[aria-expanded="true"] {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .picker-button .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .picker-button .caret { color: var(--muted); font-size: 0.7rem; flex: 0 0 auto; }
  .picker-panel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); overflow: hidden;
  }
  .picker-panel[hidden] { display: none !important; }
  .picker-search {
    width: 100%; padding: 8px 10px; border: 0; border-bottom: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .picker-search:focus { outline: none; }
  .picker-list { max-height: 260px; overflow-y: auto; }
  .picker-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer;
    font-size: 0.9rem;
  }
  .picker-row:hover, .picker-row[aria-selected="true"] { background: var(--bg); }
  .picker-empty { padding: 10px; color: var(--muted); font-size: 0.85rem; }

  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 0.82rem;
    white-space: nowrap;
  }

  .detail-header { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .detail-icon {
    width: 88px; height: 88px; border-radius: 14px; flex: 0 0 auto;
    object-fit: cover; background: var(--bg); border: 1px solid var(--line);
  }
  .detail-icon.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 2rem; font-weight: 700;
  }
  .detail-title { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .detail-paldeck { color: var(--muted); font-size: 0.8rem; }
  .detail-name { font-size: 1.35rem; font-weight: 700; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; color: #fff;
  }
  .badge.outline {
    background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500;
  }
  .badge.rarity-common { background: #7d8794; }
  .badge.rarity-rare { background: #2f6df6; }
  .badge.rarity-epic { background: #7b3fbf; }
  .badge.rarity-legendary { background: #c8912a; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-section { margin-bottom: 22px; }
  .detail-section h3 {
    font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 10px;
  }
  .stat-row { margin-bottom: 9px; }
  .stat-row .stat-label {
    display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 3px;
  }
  .stat-row .stat-value { font-variant-numeric: tabular-nums; color: var(--muted); }
  .stat-track {
    height: 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
    overflow: hidden;
  }
  .stat-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .passive-card {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px;
  }
  .passive-card .name { font-weight: 600; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="heading">Palworld Data API</h1>
      <p class="sub" id="subtitle">Consultas de crianza, rutas y pasivas contra la API local.</p>
    </div>
    <div class="lang-switch" role="group" aria-label="Idioma / Language">
      <button type="button" class="lang-btn" data-lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="route" aria-selected="true"></button>
    <button class="tab" role="tab" data-view="breed" aria-selected="false"></button>
    <button class="tab" role="tab" data-view="passives" aria-selected="false"></button>
    <button class="tab" role="tab" data-view="parents" aria-selected="false"></button>
    <button class="tab" role="tab" data-view="work" aria-selected="false"></button>
    <button class="tab" role="tab" data-view="detail" aria-selected="false"></button>
  </div>

  <div class="panel">
    <div class="row" id="controls"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
const out = document.getElementById("out");
const controls = document.getElementById("controls");
let pals = [];
// The picker currently showing its dropdown, if any: { root, close }. Tracked
// so a single document-level click listener can close whichever is open,
// instead of every picker registering (and leaking) its own.
let activePicker = null;

// Every user-facing string, in both languages this UI supports. Passive and
// pal names come from the API's own `lang` query param instead (see `api()`
// and `PALS_URL`), since those are game data with their own translation
// coverage, not fixed UI chrome.
const I18N = {
  es: {
    heading: "Palworld Data API",
    subtitle: "Consultas de crianza, rutas y pasivas contra la API local.",
    tabs: { route: "Ruta", breed: "Cruce", passives: "Pasivas", parents: "Progenitores", work: "Trabajo", detail: "Detalle" },
    target: "Objetivo", owned: "Pals que tienes (coma)", ownedPlaceholder: "vacío = todos los capturables",
    strategy: "Estrategia", generations: "Generaciones", tree: "Árbol",
    parentA: "Progenitor A", parentB: "Progenitor B",
    pal: "Pal", goal: "Uso", combat: "Combate", base: "Base",
    activity: "Actividad", allSummary: "Todas (resumen)",
    consult: "Consultar",
    searchPalPlaceholder: "Buscar pal…", searchPalLabel: "Buscar pal",
    noResults: "Sin resultados.", noPalsAvailable: "Sin pals disponibles",
    chooseAndRun: "Elige una consulta y pulsa el botón.",
    specialCombo: "combo especial", sameSpecies: "misma especie",
    genderMale: "macho", genderFemale: "hembra",
    alreadyOwned: "Ya lo tienes: no hace falta criar nada.",
    routeSummary: (g, s) => `${g} generación(es), ${s} cruce(s) distintos.`,
    routeAlternatives: "Alternativas para el último paso: ",
    breedRequires: "Requiere: ",
    breedAlternatives: "La misma pareja puede dar, con los sexos invertidos: ",
    breedTargetRank: (r) => `Rango objetivo calculado: ${r}`,
    noUsefulPassives: "Ninguna pasiva aporta nada para este objetivo.",
    passivesScore: (s, c) => `Puntuación total ${s} sobre ${c} pasivas evaluadas.`,
    thPassive: "Pasiva", thCondition: "Condición", thPoints: "Puntos", none: "—",
    noParents: "Ninguna pareja produce este pal.",
    parentsCount: (n) => `${n} pareja(s) lo producen.`,
    andMore: (n) => `… y ${n} más.`,
    noWorkData: "Este dataset no trae aptitudes de trabajo.",
    thActivity: "Actividad", thBestPals: "Mejores pals",
    noPalsForActivity: "Ningún pal tiene esta aptitud en este dataset.",
    bestPalsFor: (label) => `Mejores pals para ${label}:`,
    thPal: "Pal", thLevel: "Nivel",
    work: {
      watering: "Riego", planting: "Siembra", lumbering: "Tala", mining: "Minería",
      kindling: "Encendido", generating_electricity: "Generación eléctrica",
      handiwork: "Manualidades", gathering: "Recolección",
      medicine_production: "Producción medicinal", cooling: "Enfriamiento",
      transporting: "Transporte", farming: "Granja", oil_extraction: "Extracción de petróleo",
    },
    paldeckNo: (n) => `N.º ${n}`,
    rarityCommon: "Común", rarityRare: "Raro", rarityEpic: "Épico", rarityLegendary: "Legendario",
    wildObtainable: "Capturable en el mundo", breedOnly: "Solo por crianza",
    genderRatio: (m, f) => `${m}% macho / ${f}% hembra`,
    statsHeading: "Estadísticas", workHeading: "Idoneidad para el Trabajo",
    innatePassivesHeading: "Pasivas Garantizadas", noInnatePassives: "Ninguna.",
    bestForBase: "Mejores pasivas para Base", bestForCombat: "Mejores pasivas para Combate",
    noWorkSuitability: "Sin idoneidades de trabajo registradas.",
    stat_hp: "PV", stat_melee_attack: "Ataque Cuerpo a Cuerpo", stat_ranged_attack: "Ataque a Distancia",
    stat_defense: "Defensa", stat_support: "Soporte", stat_stamina: "Energía",
    stat_run_speed: "Velocidad de Carrera", stat_mount_run_speed: "Velocidad en Montura",
    stat_walk_speed: "Velocidad de Caminata Lenta", stat_price: "Precio",
    elements: {
      neutral: "Normal", fire: "Fuego", water: "Agua", grass: "Hoja",
      electric: "Electricidad", ice: "Hielo", ground: "Tierra", dark: "Oscuridad",
      dragon: "Dragón",
    },
  },
  en: {
    heading: "Palworld Data API",
    subtitle: "Breeding, route and passive queries against the local API.",
    tabs: { route: "Route", breed: "Breed", passives: "Passives", parents: "Parents", work: "Work", detail: "Detail" },
    target: "Target", owned: "Pals you own (comma)", ownedPlaceholder: "empty = everything catchable",
    strategy: "Strategy", generations: "Generations", tree: "Tree",
    parentA: "Parent A", parentB: "Parent B",
    pal: "Pal", goal: "Use", combat: "Combat", base: "Base",
    activity: "Activity", allSummary: "All (summary)",
    consult: "Query",
    searchPalPlaceholder: "Search pal…", searchPalLabel: "Search pal",
    noResults: "No results.", noPalsAvailable: "No pals available",
    chooseAndRun: "Pick a query and press the button.",
    specialCombo: "special combo", sameSpecies: "same species",
    genderMale: "male", genderFemale: "female",
    alreadyOwned: "You already have it: no breeding needed.",
    routeSummary: (g, s) => `${g} generation(s), ${s} distinct cross(es).`,
    routeAlternatives: "Alternatives for the final step: ",
    breedRequires: "Requires: ",
    breedAlternatives: "The same pair can also give, with sexes swapped: ",
    breedTargetRank: (r) => `Computed target rank: ${r}`,
    noUsefulPassives: "No passive helps for this goal.",
    passivesScore: (s, c) => `Total score ${s} out of ${c} passives considered.`,
    thPassive: "Passive", thCondition: "Condition", thPoints: "Points", none: "—",
    noParents: "No pair produces this pal.",
    parentsCount: (n) => `${n} pair(s) produce it.`,
    andMore: (n) => `… and ${n} more.`,
    noWorkData: "This dataset has no work suitabilities.",
    thActivity: "Activity", thBestPals: "Best pals",
    noPalsForActivity: "No pal has this suitability in this dataset.",
    bestPalsFor: (label) => `Best pals for ${label}:`,
    thPal: "Pal", thLevel: "Level",
    work: {
      watering: "Watering", planting: "Planting", lumbering: "Lumbering", mining: "Mining",
      kindling: "Kindling", generating_electricity: "Generating Electricity",
      handiwork: "Handiwork", gathering: "Gathering",
      medicine_production: "Medicine Production", cooling: "Cooling",
      transporting: "Transporting", farming: "Farming", oil_extraction: "Oil Extraction",
    },
    paldeckNo: (n) => `No. ${n}`,
    rarityCommon: "Common", rarityRare: "Rare", rarityEpic: "Epic", rarityLegendary: "Legendary",
    wildObtainable: "Catchable in the world", breedOnly: "Breeding only",
    genderRatio: (m, f) => `${m}% male / ${f}% female`,
    statsHeading: "Stats", workHeading: "Work Suitability",
    innatePassivesHeading: "Guaranteed Passives", noInnatePassives: "None.",
    bestForBase: "Best passives for Base", bestForCombat: "Best passives for Combat",
    noWorkSuitability: "No recorded work suitabilities.",
    stat_hp: "HP", stat_melee_attack: "Melee Attack", stat_ranged_attack: "Ranged Attack",
    stat_defense: "Defense", stat_support: "Support", stat_stamina: "Stamina",
    stat_run_speed: "Run Speed", stat_mount_run_speed: "Mount Run Speed",
    stat_walk_speed: "Slow Walk Speed", stat_price: "Price",
    elements: {
      neutral: "Neutral", fire: "Fire", water: "Water", grass: "Grass",
      electric: "Electric", ice: "Ice", ground: "Ground", dark: "Dark", dragon: "Dragon",
    },
  },
};

let LANG = "es";
try {
  LANG = localStorage.getItem("palworld_lang") || "es";
} catch {
  // Private browsing or blocked storage: fall back to the default silently.
}
const t = (key) => I18N[LANG][key];

function buildViews() {
  return {
    route: {
      fields: [
        { id: "target", label: t("target"), type: "pal" },
        { id: "owned", label: t("owned"), type: "text", placeholder: t("ownedPlaceholder") },
        { id: "strategy", label: t("strategy"), type: "select", options: [["generations", t("generations")], ["tree", t("tree")]] },
      ],
      run: runRoute,
    },
    breed: {
      fields: [
        { id: "parent_a", label: t("parentA"), type: "pal" },
        { id: "parent_b", label: t("parentB"), type: "pal" },
      ],
      run: runBreed,
    },
    passives: {
      fields: [
        { id: "pal", label: t("pal"), type: "pal" },
        { id: "goal", label: t("goal"), type: "select", options: [["combat", t("combat")], ["base", t("base")]] },
      ],
      run: runPassives,
    },
    parents: {
      fields: [{ id: "pal", label: t("pal"), type: "pal" }],
      run: runParents,
    },
    work: {
      fields: [
        {
          id: "activity",
          label: t("activity"),
          type: "select",
          options: [["", t("allSummary")], ...Object.entries(t("work"))],
        },
      ],
      run: runWork,
    },
    detail: {
      fields: [{ id: "pal", label: t("pal"), type: "pal" }],
      run: runDetail,
    },
  };
}

// Rough color per element, used only for the placeholder badge a pal gets
// when it has no real icon on disk yet. Not game data -- just a visual hint.
const ELEMENT_COLORS = {
  fire: "#e2543a", water: "#3a8de2", grass: "#4c9a4c", electric: "#d8b23a",
  ice: "#4bb8c8", ground: "#a3763f", dark: "#6a5a8a", dragon: "#7a5ad8",
  neutral: "#8a919c",
};

function palIcon(pal, size) {
  const className = size === "small" ? "pal-icon small" : size === "large" ? "detail-icon" : "pal-icon";
  if (pal && pal.icon) {
    const img = document.createElement("img");
    img.className = className;
    img.src = pal.icon;
    img.alt = "";
    img.loading = "lazy";
    return img;
  }
  const badge = el("div", className + " placeholder");
  badge.style.background = ELEMENT_COLORS[(pal && pal.elements && pal.elements[0]) || "neutral"];
  badge.textContent = pal ? pal.name.charAt(0) : "?";
  return badge;
}

const palById = (id) => pals.find((p) => p.id === id);

// An "A + B → C" row with each pal shown as icon + name, not bare text.
// `connectors` has one fewer entry than `ids`, placed between consecutive pals.
function formula(ids, connectors) {
  const row = el("span", "formula-row");
  ids.forEach((id, index) => {
    if (index > 0) row.appendChild(el("span", "connector", connectors[index - 1]));
    row.appendChild(palIcon(palById(id), "small"));
    row.appendChild(document.createTextNode(nameOf(id)));
  });
  return row;
}

// A searchable "pal" field: a hidden input (so `value()` and everything
// downstream keep working exactly as with the native <select> this replaces)
// plus a button showing the current pick's icon and a dropdown to change it.
function createPalPicker(wrap, fieldId) {
  const hidden = document.createElement("input");
  hidden.type = "hidden";
  hidden.id = "f_" + fieldId;

  const root = el("div", "picker");
  const button = document.createElement("button");
  button.type = "button";
  button.className = "picker-button";
  button.setAttribute("aria-haspopup", "listbox");
  button.setAttribute("aria-expanded", "false");

  const panel = el("div", "picker-panel");
  panel.hidden = true;
  const search = document.createElement("input");
  search.type = "text";
  search.className = "picker-search";
  search.placeholder = t("searchPalPlaceholder");
  search.setAttribute("aria-label", t("searchPalLabel"));
  const list = el("div", "picker-list");
  list.setAttribute("role", "listbox");
  panel.appendChild(search);
  panel.appendChild(list);

  function showButton(pal) {
    button.innerHTML = "";
    button.appendChild(palIcon(pal));
    button.appendChild(el("span", "name", pal ? pal.name : t("noPalsAvailable")));
    button.appendChild(el("span", "caret", "▾"));
  }

  function close() {
    panel.hidden = true;
    button.setAttribute("aria-expanded", "false");
    if (activePicker && activePicker.close === close) activePicker = null;
  }

  function selectPal(pal) {
    hidden.value = pal.id;
    showButton(pal);
    close();
  }

  function renderRows(filterText) {
    list.innerHTML = "";
    const needle = filterText.trim().toLowerCase();
    const matches = needle
      ? pals.filter((p) => p.name.toLowerCase().includes(needle))
      : pals;
    if (!matches.length) {
      list.appendChild(el("div", "picker-empty", t("noResults")));
      return;
    }
    for (const pal of matches.slice(0, 300)) {
      const row = el("div", "picker-row");
      row.setAttribute("role", "option");
      if (pal.id === hidden.value) row.setAttribute("aria-selected", "true");
      row.appendChild(palIcon(pal, "small"));
      row.appendChild(el("span", "name", pal.name));
      row.onclick = () => selectPal(pal);
      list.appendChild(row);
    }
  }

  function open() {
    if (!pals.length) return;
    panel.hidden = false;
    button.setAttribute("aria-expanded", "true");
    search.value = "";
    renderRows("");
    activePicker = { root, close };
    search.focus();
  }

  button.onclick = () => (panel.hidden ? open() : close());
  search.oninput = () => renderRows(search.value);
  search.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      close();
      button.focus();
    } else if (event.key === "Enter") {
      const first = list.querySelector(".picker-row");
      if (first) first.click();
    }
  });

  root.appendChild(button);
  root.appendChild(panel);
  wrap.appendChild(hidden);
  wrap.appendChild(root);
  showButton(pals[0]);
  if (pals[0]) hidden.value = pals[0].id;
}

// One shared listener rather than one per picker: closes whichever picker is
// open when a click lands outside it. Registered once, at load time.
document.addEventListener("click", (event) => {
  if (activePicker && !activePicker.root.contains(event.target)) {
    activePicker.close();
  }
});

let currentView = "route";

// Redraws everything the current language touches: tab labels, the field
// panel for whichever tab is open, and the page heading -- everything that
// isn't game data fetched with its own `lang` param.
function applyLanguage() {
  document.documentElement.lang = LANG;
  for (const btn of document.querySelectorAll(".lang-btn")) {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === LANG));
  }
  document.getElementById("heading").textContent = t("heading");
  document.getElementById("subtitle").textContent = t("subtitle");
  for (const tab of document.querySelectorAll(".tab")) {
    tab.textContent = t("tabs")[tab.dataset.view];
  }
  render(currentView);
}

function render(view) {
  currentView = view;
  const views = buildViews();
  controls.innerHTML = "";
  activePicker = null; // its DOM is about to be wiped along with `controls`
  for (const field of views[view].fields) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const label = document.createElement("label");
    label.textContent = field.label;
    label.htmlFor = "f_" + field.id;
    wrap.appendChild(label);

    let input;
    if (field.type === "select") {
      input = document.createElement("select");
      for (const [value, text] of field.options) {
        input.appendChild(new Option(text, value));
      }
    } else if (field.type === "pal") {
      createPalPicker(wrap, field.id);
      controls.appendChild(wrap);
      continue;
    } else {
      input = document.createElement("input");
      input.type = "text";
      if (field.placeholder) input.placeholder = field.placeholder;
    }
    input.id = "f_" + field.id;
    wrap.appendChild(input);
    controls.appendChild(wrap);
  }
  const holder = document.createElement("div");
  holder.className = "field";
  holder.style.flex = "0 0 auto";
  const button = document.createElement("button");
  button.textContent = t("consult");
  button.onclick = () => views[view].run().catch(showError);
  holder.appendChild(button);
  controls.appendChild(holder);
  out.innerHTML = "";
  out.appendChild(el("p", "empty", t("chooseAndRun")));
}

const value = (id) => document.getElementById("f_" + id).value.trim();
const nameOf = (id) => (pals.find((p) => p.id === id) || {}).name || id;

function showError(error) {
  out.innerHTML = "";
  const p = document.createElement("p");
  p.className = "err";
  p.textContent = error.message;
  out.appendChild(p);
}

async function api(path) {
  const url = path + (path.includes("?") ? "&" : "?") + `lang=${LANG}`;
  const response = await fetch(url);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
  return body;
}

// The API states gender requirements in English regardless of `lang` (it's a
// fixed two-word grammar, "X must be male/female", not free text); translate
// the two words here instead of asking the backend to localise a sentence
// shape the UI already knows how to rebuild.
function translateGenders(text) {
  return text
    .split(", ")
    .map((clause) => {
      const match = clause.match(/^(.*) must be (male|female)$/);
      if (!match) return clause;
      return `${nameOf(match[1])} ${match[2] === "male" ? t("genderMale") : t("genderFemale")}`;
    })
    .join(" + ");
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function runRoute() {
  const params = new URLSearchParams({ target: value("target"), strategy: value("strategy") });
  const owned = value("owned");
  const query = new URLSearchParams({ strategy: value("strategy") });
  if (owned) for (const o of owned.split(",").map((s) => s.trim()).filter(Boolean)) query.append("owned", o);
  const data = await api(`/routes/${encodeURIComponent(value("target"))}?${query}`);

  out.innerHTML = "";
  if (data.already_owned) {
    out.appendChild(el("p", "empty", t("alreadyOwned")));
    return;
  }
  out.appendChild(el("p", "meta", t("routeSummary")(data.generations, data.distinct_steps)));
  for (const step of data.steps) {
    const row = el("div", "step");
    row.appendChild(el("span", "gen", "G" + step.generation));
    row.appendChild(formula([step.parent_a, step.parent_b, step.child], [" + ", " → "]));
    if (step.rule === "special") row.appendChild(el("span", "tag special", t("specialCombo")));
    else if (step.rule === "same_species") row.appendChild(el("span", "tag", t("sameSpecies")));
    if (step.gender_requirement) {
      row.appendChild(el("span", "tag gender", translateGenders(step.gender_requirement)));
    }
    out.appendChild(row);
  }
  if (data.alternatives_for_final_step.length) {
    out.appendChild(el("p", "meta", t("routeAlternatives") +
      data.alternatives_for_final_step.map((p) => `${nameOf(p[0])} + ${nameOf(p[1])}`).join(" · ")));
  }
}

async function runBreed() {
  const query = new URLSearchParams({ parent_a: value("parent_a"), parent_b: value("parent_b") });
  const data = await api(`/breed?${query}`);
  out.innerHTML = "";
  const row = el("div", "step");
  row.appendChild(formula([data.parent_a, data.parent_b, data.child], [" + ", " → "]));
  if (data.rule === "special") row.appendChild(el("span", "tag special", t("specialCombo")));
  out.appendChild(row);
  if (data.gender_requirement) {
    out.appendChild(el("p", "meta", t("breedRequires") + translateGenders(data.gender_requirement)));
  }
  if (data.alternatives && data.alternatives.length) {
    out.appendChild(el("p", "meta",
      t("breedAlternatives") + data.alternatives.map(nameOf).join(", ")));
  }
  if (data.target_rank !== null && data.target_rank !== undefined) {
    out.appendChild(el("p", "meta", t("breedTargetRank")(data.target_rank)));
  }
}

async function runPassives() {
  const data = await api(
    `/pals/${encodeURIComponent(value("pal"))}/passives?goal=${encodeURIComponent(value("goal"))}`);
  out.innerHTML = "";
  if (!data.passives.length) {
    out.appendChild(el("p", "empty", t("noUsefulPassives")));
    return;
  }
  out.appendChild(el("p", "meta", t("passivesScore")(data.total_score, data.considered)));
  const scroll = el("div", "scroll");
  const table = el("table");
  table.innerHTML = `<thead><tr><th>${t("thPassive")}</th><th>${t("thCondition")}</th><th class='num'>${t("thPoints")}</th></tr></thead>`;
  const body = el("tbody");
  for (const passive of data.passives) {
    const tr = el("tr");
    tr.appendChild(el("td", null, passive.name));
    tr.appendChild(el("td", null, passive.condition || t("none")));
    tr.appendChild(el("td", "num", String(passive.score)));
    body.appendChild(tr);
  }
  table.appendChild(body);
  scroll.appendChild(table);
  out.appendChild(scroll);
}

async function runParents() {
  const data = await api(`/pals/${encodeURIComponent(value("pal"))}/parents`);
  out.innerHTML = "";
  if (!data.count) {
    out.appendChild(el("p", "empty", t("noParents")));
    return;
  }
  out.appendChild(el("p", "meta", t("parentsCount")(data.count)));
  for (const pair of data.pairs.slice(0, 60)) {
    const row = el("div", "step");
    row.appendChild(formula(pair, [" + "]));
    out.appendChild(row);
  }
  if (data.count > 60) out.appendChild(el("p", "meta", t("andMore")(data.count - 60)));
}

function workTable(headers) {
  const scroll = el("div", "scroll");
  const table = el("table");
  table.innerHTML = "<thead><tr>" + headers.map((h) => `<th>${h}</th>`).join("") + "</tr></thead>";
  const body = el("tbody");
  table.appendChild(body);
  scroll.appendChild(table);
  return { scroll, body };
}

async function runWork() {
  const activity = value("activity");
  out.innerHTML = "";

  if (!activity) {
    // No activity chosen: a one-screen summary across every base activity,
    // which is the question people actually ask ("who's my best miner?").
    const data = await api("/work?limit=5");
    const activities = Object.keys(data.by_work);
    if (!activities.length) {
      out.appendChild(el("p", "empty", t("noWorkData")));
      return;
    }
    const { scroll, body } = workTable([t("thActivity"), t("thBestPals")]);
    for (const work of activities) {
      const tr = el("tr");
      tr.appendChild(el("td", null, t("work")[work] || work));
      const cell = el("td", "chip-list");
      for (const entry of data.by_work[work]) {
        const chip = el("span", "chip");
        chip.appendChild(palIcon(palById(entry.pal), "small"));
        chip.appendChild(document.createTextNode(`${entry.name} (Lv.${entry.level})`));
        cell.appendChild(chip);
      }
      tr.appendChild(cell);
      body.appendChild(tr);
    }
    out.appendChild(scroll);
    return;
  }

  const data = await api(`/work/${encodeURIComponent(activity)}/best?limit=15`);
  if (!data.pals.length) {
    out.appendChild(el("p", "empty", t("noPalsForActivity")));
    return;
  }
  out.appendChild(el("p", "meta", t("bestPalsFor")(t("work")[data.work] || data.work)));
  const { scroll, body } = workTable([t("thPal"), t("thLevel")]);
  for (const p of data.pals) {
    const tr = el("tr");
    const cell = el("td");
    cell.style.display = "flex";
    cell.style.alignItems = "center";
    cell.style.gap = "6px";
    cell.appendChild(palIcon(palById(p.pal), "small"));
    cell.appendChild(document.createTextNode(p.name));
    tr.appendChild(cell);
    tr.appendChild(el("td", "num", String(p.level)));
    body.appendChild(tr);
  }
  out.appendChild(scroll);
}

// Visual caps for the base-stat bars: not game data, just how much of the bar
// a typical value fills. A pal whose stat exceeds its cap still shows a full
// bar rather than overflowing or erroring.
const STAT_CAPS = {
  hp: 200, melee_attack: 200, ranged_attack: 200, defense: 200, support: 200,
  stamina: 500, run_speed: 1500, mount_run_speed: 2000, walk_speed: 300, price: 10000,
};
const STAT_ORDER = [
  "hp", "melee_attack", "ranged_attack", "defense", "support",
  "stamina", "run_speed", "mount_run_speed", "walk_speed", "price",
];

// Rarity has no explicit tier field in the dataset, only the raw number the
// game itself uses; these breakpoints were reverse-engineered from known
// rarity/tier pairs and are a display grouping, not new data.
function rarityInfo(rarity) {
  if (rarity >= 20) return { label: t("rarityLegendary"), cls: "rarity-legendary" };
  if (rarity >= 8) return { label: t("rarityEpic"), cls: "rarity-epic" };
  if (rarity >= 6) return { label: t("rarityRare"), cls: "rarity-rare" };
  return { label: t("rarityCommon"), cls: "rarity-common" };
}

function statBar(key, rawValue) {
  const row = el("div", "stat-row");
  const label = el("div", "stat-label");
  label.appendChild(el("span", null, t("stat_" + key)));
  label.appendChild(el("span", "stat-value", String(rawValue)));
  row.appendChild(label);
  const track = el("div", "stat-track");
  const fill = el("div", "stat-fill");
  const pct = Math.max(2, Math.min(100, (rawValue / STAT_CAPS[key]) * 100));
  fill.style.width = pct + "%";
  track.appendChild(fill);
  row.appendChild(track);
  return row;
}

function passiveCards(heading, recommendation) {
  const section = el("div", "detail-section");
  section.appendChild(el("h3", null, heading));
  if (!recommendation.passives.length) {
    section.appendChild(el("p", "empty", t("noUsefulPassives")));
    return section;
  }
  for (const passive of recommendation.passives) {
    const card = el("div", "passive-card");
    card.appendChild(el("div", "name", passive.name));
    card.appendChild(el("div", "meta", String(passive.score)));
    section.appendChild(card);
  }
  return section;
}

async function runDetail() {
  const id = value("pal");
  const [detail, combat, base] = await Promise.all([
    api(`/pals/${encodeURIComponent(id)}`),
    api(`/pals/${encodeURIComponent(id)}/passives?goal=combat`),
    api(`/pals/${encodeURIComponent(id)}/passives?goal=base`),
  ]);
  const pal = detail.pal;
  out.innerHTML = "";

  const header = el("div", "detail-header");
  header.appendChild(palIcon({ ...pal, icon: detail.icon }, "large"));

  const title = el("div", "detail-title");
  if (pal.paldeck) title.appendChild(el("div", "detail-paldeck", t("paldeckNo")(pal.paldeck)));
  title.appendChild(el("div", "detail-name", pal.name));

  const badges = el("div", "badge-row");
  if (pal.rarity !== undefined && pal.rarity !== null) {
    const info = rarityInfo(pal.rarity);
    badges.appendChild(el("span", "badge " + info.cls, `${pal.rarity} ${info.label}`));
  }
  for (const elementName of pal.elements || []) {
    const badge = el("span", "badge", t("elements")[elementName] || elementName);
    badge.style.background = ELEMENT_COLORS[elementName] || ELEMENT_COLORS.neutral;
    badges.appendChild(badge);
  }
  badges.appendChild(
    el("span", "badge outline", pal.wild_obtainable ? t("wildObtainable") : t("breedOnly"))
  );
  if (pal.male_probability !== undefined && pal.male_probability !== null) {
    badges.appendChild(
      el("span", "badge outline", t("genderRatio")(pal.male_probability, 100 - pal.male_probability))
    );
  }
  title.appendChild(badges);
  header.appendChild(title);
  out.appendChild(header);

  const grid = el("div", "detail-grid");

  const statsColumn = el("div");
  const statsSection = el("div", "detail-section");
  statsSection.appendChild(el("h3", null, t("statsHeading")));
  const baseStats = pal.base_stats || {};
  const presentStats = STAT_ORDER.filter((key) => baseStats[key] !== undefined);
  if (presentStats.length) {
    for (const key of presentStats) statsSection.appendChild(statBar(key, baseStats[key]));
  } else {
    statsSection.appendChild(el("p", "empty", t("none")));
  }
  statsColumn.appendChild(statsSection);
  grid.appendChild(statsColumn);

  const infoColumn = el("div");

  const workSection = el("div", "detail-section");
  workSection.appendChild(el("h3", null, t("workHeading")));
  const workEntries = Object.entries(pal.work || {});
  if (workEntries.length) {
    const list = el("div", "chip-list");
    for (const [workKey, level] of workEntries) {
      list.appendChild(el("span", "chip", `${t("work")[workKey] || workKey} · Lv.${level}`));
    }
    workSection.appendChild(list);
  } else {
    workSection.appendChild(el("p", "empty", t("noWorkSuitability")));
  }
  infoColumn.appendChild(workSection);

  const innateSection = el("div", "detail-section");
  innateSection.appendChild(el("h3", null, t("innatePassivesHeading")));
  if (detail.innate_passives && detail.innate_passives.length) {
    for (const passive of detail.innate_passives) {
      innateSection.appendChild(el("div", "passive-card", passive.name));
    }
  } else {
    innateSection.appendChild(el("p", "empty", t("noInnatePassives")));
  }
  infoColumn.appendChild(innateSection);

  infoColumn.appendChild(passiveCards(t("bestForCombat"), combat));
  infoColumn.appendChild(passiveCards(t("bestForBase"), base));

  grid.appendChild(infoColumn);
  out.appendChild(grid);
}

for (const tab of document.querySelectorAll(".tab")) {
  tab.onclick = () => {
    for (const other of document.querySelectorAll(".tab")) other.setAttribute("aria-selected", "false");
    tab.setAttribute("aria-selected", "true");
    render(tab.dataset.view);
  };
}

async function loadPals() {
  pals = await api("/pals?limit=1000");
  pals.sort((a, b) => a.name.localeCompare(b.name));
}

for (const btn of document.querySelectorAll(".lang-btn")) {
  btn.onclick = async () => {
    if (btn.dataset.lang === LANG) return;
    LANG = btn.dataset.lang;
    try {
      localStorage.setItem("palworld_lang", LANG);
    } catch {
      // Private browsing or blocked storage: the choice just won't persist.
    }
    try {
      await loadPals(); // pal/passive names come from the API's own `lang`
      applyLanguage();
    } catch (error) {
      showError(error);
    }
  };
}

(async function init() {
  try {
    applyLanguage(); // paints static text immediately, before any network call
    const health = await api("/health");
    const warning = health.data_quality && health.data_quality.warning;
    if (warning) {
      const banner = document.getElementById("banner");
      banner.textContent = warning;
      banner.hidden = false;
    }
    await loadPals();
    render("route");
  } catch (error) {
    showError(error);
  }
})();
</script>
</body>
</html>
