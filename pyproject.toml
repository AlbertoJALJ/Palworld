[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-data-api"
version = "0.1.0"
description = "Pal data, breeding combinations, breeding routes and passive optimisation for Palworld."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Only needed to regenerate data/i18n/*.json (`cli i18n`); the API and web UI
# never import this.
i18n = ["playwright>=1.40"]

[project.scripts]
palworld-ingest = "palworld_api.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palworld_api = ["web/*.html", "web/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PYI"]
ignore = ["E501"]
